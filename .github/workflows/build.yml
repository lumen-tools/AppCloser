name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows and Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 libgl1-mesa-dev xorg-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols zip

      - name: Vet and test
        run: |
          go vet .
          go vet -tags gui .
          go test .

      - name: Build
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: windows-linux
          path: dist/*.zip

  build-mac:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          go vet .
          go vet -tags gui .
          go test .

      - name: Build
        run: ./build-mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  # A new number in VERSION on main publishes a release with all ZIPs.
  release:
    needs: [build, build-mac]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then gh release upload "$tag" dist/*.zip --clobber; fi
            echo "Release $tag already exists."
          else
            gh release create "$tag" dist/*.zip --target "$GITHUB_SHA" --title "Version ${tag#v}" --generate-notes
          fi
