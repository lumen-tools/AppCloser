name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 libgl1-mesa-dev xorg-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols zip

      - name: Vet and test
        run: |
          go vet .
          go vet -tags gui .
          go test .

      - name: Build
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AppCloser
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "AppCloser $GITHUB_REF_NAME" --generate-notes
